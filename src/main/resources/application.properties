spring.application.name=CivicSphere
server.port=${PORT:8080}

spring.config.import=optional:file:./application-local.properties,optional:classpath:application-local.properties

spring.datasource.url=${CIVICSPHERE_DB_URL:jdbc:mysql://localhost:3306/civicsphere_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${CIVICSPHERE_DB_USER:}
spring.datasource.password=${CIVICSPHERE_DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=${CIVICSPHERE_JPA_DDL_AUTO:none}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=10MB

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m
server.error.include-message=never

spring.jackson.serialization.write-dates-as-timestamps=false

civicsphere.upload-dir=${CIVICSPHERE_UPLOAD_DIR:civicsphere-uploads}
civicsphere.max-upload-bytes=5242880
civicsphere.recurrence.distance-meters=250.0
civicsphere.recurrence.threshold=70
civicsphere.recurrence.min-similarity=0.15

