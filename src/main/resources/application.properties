spring.application.name=CivicSphere
server.port=${PORT:8080}

spring.config.import=optional:file:./application-local.properties,optional:classpath:application-local.properties

civicsphere.data-dir=${CIVICSPHERE_DATA_DIR:civicsphere-data}
civicsphere.upload-dir=${CIVICSPHERE_UPLOAD_DIR:civicsphere-uploads}
civicsphere.max-upload-bytes=5242880
civicsphere.admin-email=${CIVICSPHERE_ADMIN_EMAIL:admin@civicsphere.gov.local}
civicsphere.admin-password=${CIVICSPHERE_ADMIN_PASSWORD:Admin#Civic2026!}
civicsphere.recurrence.distance-meters=250.0
civicsphere.recurrence.threshold=70
civicsphere.recurrence.min-similarity=0.15

spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=10MB

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m
server.error.include-message=never

spring.jackson.serialization.write-dates-as-timestamps=false
