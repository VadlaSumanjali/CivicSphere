<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Complaint Management — CivicSphere Admin</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/dashboard.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div>
          <a class="brand" href="dashboard.html">
            <span class="brand-mark">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
            </span>
            <span>CivicSphere</span>
          </a>
          <div class="sidebar-role">Admin Command Center</div>
        </div>
      </div>
      <nav class="sidebar-nav">
        <a class="nav-item" href="dashboard.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
          Dashboard
        </a>
        <a class="nav-item active" href="complaints.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
          Complaints
        </a>
        <a class="nav-item" href="recurrence.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
          Recurrence Alerts
        </a>
        <a class="nav-item" href="departments.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 21h18"/><path d="M5 21V7l8-4v18"/><path d="M19 21V11l-6-4"/></svg>
          Departments
        </a>
      </nav>
      <div class="sidebar-footer">
        <div class="user-chip">
          <div class="user-chip-name" id="sidebarUserName">Loading...</div>
          <div class="user-chip-email" id="sidebarUserEmail"></div>
        </div>
        <button type="button" id="logoutBtn" class="btn btn-outline btn-sm" style="width:100%;background:rgba(255,255,255,0.08);color:#fff;border-color:rgba(255,255,255,0.2);">
          Sign Out
        </button>
      </div>
    </aside>

    <div class="app-main">
      <header class="topbar">
        <div class="topbar-left">
          <button type="button" class="mobile-menu-btn" id="mobileMenuBtn">&#9776;</button>
          <h1>Complaint Management</h1>
        </div>
      </header>

      <main class="page-content">
        <div class="filters-bar">
          <input class="form-control" type="text" id="adminSearch" placeholder="Search ID or citizen name...">
          <select class="form-control" id="adminFilterCategory"><option value="">All Categories</option></select>
          <input class="form-control" type="text" id="adminFilterLocation" placeholder="Filter by area/city...">
          <select class="form-control" id="adminFilterStatus">
            <option value="">All Statuses</option>
            <option value="SUBMITTED">Submitted</option>
            <option value="UNDER_REVIEW">Under Review</option>
            <option value="ASSIGNED">Assigned</option>
            <option value="IN_PROGRESS">In Progress</option>
            <option value="RESOLVED">Resolved</option>
            <option value="CLOSED">Closed</option>
          </select>
          <button type="button" id="adminApplyFilters" class="btn btn-navy">Filter</button>
          <button type="button" id="adminResetFilters" class="btn btn-outline">Reset</button>
        </div>

        <div class="panel">
          <div class="table-wrap">
            <table class="data-table">
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Title</th>
                  <th>Citizen</th>
                  <th>Category</th>
                  <th>Location</th>
                  <th>Department</th>
                  <th>Status</th>
                  <th>Recurrence</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="adminComplaintsBody">
                <tr><td colspan="9" class="loading-state"><span class="spinner"></span></td></tr>
              </tbody>
            </table>
          </div>
          <div class="pagination">
            <span id="adminPaginationInfo">Loading...</span>
            <div class="pagination-controls">
              <button type="button" id="adminPrevPage" class="btn btn-outline btn-sm">Previous</button>
              <button type="button" id="adminNextPage" class="btn btn-outline btn-sm">Next</button>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- Detail Modal -->
  <div class="modal-backdrop" id="detailModal">
    <div class="modal" style="max-width:680px;">
      <div class="modal-header">
        <h3>Complaint Inspection &amp; History</h3>
        <button type="button" class="toast-close" data-close-modal="detailModal">&times;</button>
      </div>
      <div class="modal-body" id="detailModalBody"></div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline" data-close-modal="detailModal">Close</button>
      </div>
    </div>
  </div>

  <!-- Assign Department Modal -->
  <div class="modal-backdrop" id="assignModal">
    <div class="modal">
      <div class="modal-header">
        <h3>Assign Department &mdash; <span id="assignComplaintLabel"></span></h3>
        <button type="button" class="toast-close" data-close-modal="assignModal">&times;</button>
      </div>
      <form id="assignForm">
        <div class="modal-body">
          <input type="hidden" id="assignComplaintId">
          <div class="form-group">
            <label class="form-label" for="assignDepartmentSelect">Responsible Department *</label>
            <select class="form-control" id="assignDepartmentSelect" required></select>
          </div>
          <div class="form-group">
            <label class="form-label" for="assignRemarks">Dispatch Remarks (Optional)</label>
            <textarea class="form-control" id="assignRemarks" placeholder="Internal dispatch notes or instructions..."></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline" data-close-modal="assignModal">Cancel</button>
          <button type="submit" class="btn btn-navy">Assign Department</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Update Status / Resolve Modal -->
  <div class="modal-backdrop" id="statusModal">
    <div class="modal">
      <div class="modal-header">
        <h3>Update Status &mdash; <span id="statusComplaintLabel"></span></h3>
        <button type="button" class="toast-close" data-close-modal="statusModal">&times;</button>
      </div>
      <form id="statusForm">
        <div class="modal-body">
          <input type="hidden" id="statusComplaintId">
          <div class="form-group">
            <label class="form-label" for="nextStatusSelect">Next Status *</label>
            <select class="form-control" id="nextStatusSelect" required></select>
          </div>
          <div class="form-group">
            <label class="form-label" for="statusRemarks">Remarks (Required when Resolving)</label>
            <textarea class="form-control" id="statusRemarks" placeholder="Describe inspection findings or resolution work completed..."></textarea>
          </div>
          <div class="form-group" id="resolutionImageGroup" style="display:none;">
            <label class="form-label" for="resolutionImageInput">Resolution Evidence Image (Optional)</label>
            <input class="form-control" type="file" id="resolutionImageInput" accept="image/jpeg,image/png,image/webp,image/gif">
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline" data-close-modal="statusModal">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Status Update</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/admin.js"></script>
  <script>window.CivicAdmin.initAdminComplaintsPage();</script>
</body>
</html>
